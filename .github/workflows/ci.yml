name: CI Pipeline

# 1. Déclencheurs : le moment d'execution du CI
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

# 2. Les Jobs (tâches à exécuter)
jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Étape A : Télécharger le code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape B : Installer Node.js 22 + activer le cache NPM
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Étape C : Installer les dépendances avec le cache
      - name: Install dependencies
        run: npm ci

      # Étape D : Rendre le script exécutable et lancer les tests
      - name: Run tests script
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh

      # Étape E : Publier le rapport de test JUnit XML sur GitHub
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always() # Publie le rapport même si un test échoue
        with:
          report_paths: 'test-results/junit.xml'
          require_tests: true
