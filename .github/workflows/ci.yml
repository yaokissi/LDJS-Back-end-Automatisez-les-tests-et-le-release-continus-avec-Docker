name: CI Pipeline

# 1. Déclencheurs : le moment d'execution du CI
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

# 2. Les Jobs (tâches à exécuter)
jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Étape A : Télécharger le code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape B : Installer Node.js 22 + activer le cache NPM
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Étape C : Installer les dépendances avec le cache
      - name: Install dependencies
        run: npm ci

      # Étape D : Rendre le script exécutable et lancer les tests
      - name: Run tests script
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh

      # Étape E : Publier le rapport de test JUnit XML sur GitHub
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always() # Publie le rapport même si un test échoue
        with:
          report_paths: 'test-results/junit.xml'
          require_tests: true
  build:
    name: Build & Push Docker Image
    needs: test # Exécution conditionnelle : Si les tests échouent, le build s'annule !
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  release:
    name: Automatic Semantic Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
